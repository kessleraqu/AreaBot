<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Bot</title>
    <link rel="icon" type="image/png" href="/static/assets/area-logo.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app">
        <header class="top-bar">
            <div class="brand" role="banner">
                <img src="/static/assets/area-logo.png" alt="Area Bot logo" class="brand-logo" width="48" height="48">
            </div>
            <nav class="tabs" role="tablist">
                <button class="tab-button active" data-target="chat-tab" role="tab" aria-selected="true">Chat</button>
                <button class="tab-button" data-target="pdf-tab" role="tab" aria-selected="false">Documentos</button>
            </nav>
        </header>
        <main class="panels">
            <section id="chat-tab" class="tab-panel active" role="tabpanel">
                <div class="chat-surface">
                    <div id="thinking-indicator" class="thinking-indicator resting home" aria-hidden="true">
                        <div class="loader">
                            <svg width="100" height="100" viewBox="0 0 100 100">
                                <defs>
                                    <mask id="clipping">
                                        <polygon points="0,0 100,0 100,100 0,100" fill="black" />
                                        <polygon points="25,25 75,25 50,75" fill="white" />
                                        <polygon points="50,25 75,75 25,75" fill="white" />
                                        <polygon points="35,35 65,35 50,65" fill="white" />
                                        <polygon points="35,35 65,35 50,65" fill="white" />
                                        <polygon points="35,35 65,35 50,65" fill="white" />
                                        <polygon points="35,35 65,35 50,65" fill="white" />
                                    </mask>
                                </defs>
                            </svg>
                            <div class="box"></div>
                        </div>
                    </div>
                    <div id="chat-log" class="chat-log" aria-live="polite"></div>
                </div>
                <form id="chat-form" class="chat-form" autocomplete="off">
                    <textarea id="chat-input" name="message" rows="1" placeholder="Pregunta a Area Bot..." required></textarea>
                    <button type="submit" class="send-button">
                        <span class="sr-only">Enviar mensaje</span>
                    </button>
                </form>
            </section>
            <section id="pdf-tab" class="tab-panel" role="tabpanel" aria-hidden="true">
                <div class="pdf-controls">
                    <div class="upload-group">
                        <label class="file-input">
                            <input id="pdf-input" type="file" accept="application/pdf" multiple>
                            <span>Seleccionar archivos PDF</span>
                        </label>
                        <button id="upload-btn" class="primary">Agregar a la cola</button>
                    </div>
                    <button id="process-btn" class="secondary">Iniciar extracción</button>
                </div>
                <div id="pdf-feedback" class="feedback" role="status"></div>
                <div class="pdf-lists">
                    <section class="pdf-column">
                        <h2>PDF pendientes</h2>
                        <ul id="pending-list" class="pdf-list" aria-live="polite"></ul>
                    </section>
                    <section class="pdf-column">
                        <h2>Base de conocimiento</h2>
                        <ul id="processed-list" class="pdf-list" aria-live="polite"></ul>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/app.js" defer></script>
</body>
</html>
